# Reports GitHub Actions cache usage grouped by key prefix (e.g. buildkit, ccache, vcpkg).
# Run locally: python3 .ci/gha_cache_usage.py

name: Cache usage report

on:
  push:
  workflow_dispatch:

jobs:
  report:
    name: GHA cache usage
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report cache usage
        id: cache_report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .ci/gha_cache_usage.py --markdown --repo "$GITHUB_REPOSITORY" | tee report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

name: Build Web Site

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the site on GitHub Pages
        type: boolean
        default: false

# One run at a time: each reads the live site to keep its version before it publishes
concurrency:
  group: web-site
  cancel-in-progress: false

jobs:
  app:
    # A job-level block replaces the workflow-level one: this job reads other runs
    permissions:
      actions: read
      contents: read
    name: Application build
    runs-on: ubuntu-latest    # https://github.com/actions/runner-images
    timeout-minutes: 5
    outputs:
      run-id: ${{ steps.app.outputs.run-id }}
      sha: ${{ steps.app.outputs.sha }}

    steps:
      - name: "Find the WebAssembly build of the newest push to master"
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run started again later would pair this commit's page with a newer application
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/master | cut -f1)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::error::master has moved from $GITHUB_SHA to $head since this run was started: start a new run"
            exit 1
          fi
          if [[ $GITHUB_REF != refs/heads/master ]]; then
            echo "::error::The site is built from master: start this workflow there, not on $GITHUB_REF"
            exit 1
          fi
          # Pushes that change no built file start no run, so the newest run is the build of what master holds
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w desktop-build.yml -b master -e push -L 1 \
            --json databaseId,headSha,status,conclusion --jq '.[] | "\(.databaseId) \(.headSha) \(.status) \(.conclusion)"')
          if [[ -z $run ]]; then
            echo "::error::There is no Build Desktop run for a push to master, so there is no application for the site"
            exit 1
          fi
          read -r id sha status conclusion <<<"$run"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          if [[ $status != completed || $conclusion != success ]]; then
            echo "::error::$url, the newest Build Desktop run for a push to master, has not succeeded ($status $conclusion)"
            exit 1
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=Cockatrice-wasm" \
            --jq '.artifacts[0] // empty | "\(.expired) \(.expires_at)"')
          if [[ -z $artifact ]]; then
            echo "::error::$url, the newest Build Desktop run for a push to master, has no artifact Cockatrice-wasm"
            exit 1
          fi
          read -r expired expires_at <<<"$artifact"
          if [[ $expired == true ]]; then
            echo "::error::The artifact Cockatrice-wasm of $url, the newest Build Desktop run for a push to master, expired on $expires_at"
            exit 1
          fi
          echo "Cockatrice-wasm of $url, commit $sha"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  card-database:
    name: Card database
    needs: app
    runs-on: ubuntu-latest    # https://github.com/actions/runner-images
    timeout-minutes: 30
    env:
      CACHE: ${{ github.workspace }}/.cache/Debian13
      NAME: Debian13

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build Debian 13 Docker image"
        shell: bash
        run: source .ci/docker.sh --build

      - name: "Build Oracle and the card database"
        shell: bash
        run: |
          source .ci/docker.sh
          BUILD_SCRIPT=.ci/card_database.sh RUN card-database

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: card-database
          path: |
            card-database/cards.xml
            card-database/tokens.xml
          if-no-files-found: error

  site:
    # A job-level block replaces the workflow-level one: this job reads another run's artifact
    permissions:
      actions: read
      contents: read
    name: Site
    needs: [app, card-database]
    runs-on: ubuntu-latest    # https://github.com/actions/runner-images
    timeout-minutes: 15
    outputs:
      pages-artifact: ${{ steps.pages-artifact.outputs.name }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download the WebAssembly build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Cockatrice-wasm
          path: ${{ runner.temp }}/app
          run-id: ${{ needs.app.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: "Download the card database"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: card-database
          path: ${{ runner.temp }}/database

      # Without the live site's address its version cannot be kept: fine for a trial build, not for a publish
      - name: "Assemble the site"
        env:
          PUBLISH: ${{ inputs.publish }}
          WEB_SITE_URL: ${{ vars.WEB_SITE_URL }}
          WEB_SITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.app.outputs.sha }}
        run: |
          if [[ $PUBLISH == true && -z $WEB_SITE_URL ]]; then
            echo "::error::Publishing needs the repository variable WEB_SITE_URL, the address of the live site"
            exit 1
          fi
          .ci/web_site.sh "$RUNNER_TEMP/app" "$RUNNER_TEMP/database" "$RUNNER_TEMP/site" ${WEB_SITE_URL:+"$WEB_SITE_URL"}

      - name: "Start the client from the site as a static host serves it"
        env:
          # The runner image forbids the unprivileged user namespaces that Chrome's sandbox needs
          CHROME_FLAGS: --no-sandbox
          WASM_SMOKE_ISOLATION_HEADERS: 0
        run: .ci/wasm_smoke.sh "$RUNNER_TEMP/site"

      # A run holds one Pages artifact per attempt: a second one under the same name stops the deployment
      - name: "Name the Pages artifact after this attempt"
        id: pages-artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-site
          path: ${{ runner.temp }}/site/
          if-no-files-found: error

      - name: "Upload the site for GitHub Pages"
        if: inputs.publish
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: ${{ runner.temp }}/site/

  publish:
    if: inputs.publish
    # A job-level block replaces the workflow-level one: publishing needs these two and nothing else
    permissions:
      pages: write
      id-token: write
    name: Publish
    needs: site
    runs-on: ubuntu-latest    # https://github.com/actions/runner-images
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      # This job can be started again long after its run built the site
      - name: "Refuse a site that master has moved past"
        run: |
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/master | cut -f1)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::error::master has moved from $GITHUB_SHA to $head since this site was built: start a new run"
            exit 1
          fi

      - name: "Publish on GitHub Pages"
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.site.outputs.pages-artifact }}
